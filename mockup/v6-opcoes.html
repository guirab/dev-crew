<title>dev-crew · mockup v6 (3 direções)</title>
<!--
  Mockup v6 (2026-10-16): três direções de layout pro app inteiro, mesmas cores do v4/v5 (grafite + verde #2bee86).
  Problemas atacados (feedback do v5): informação demais ao mesmo tempo, hierarquia confusa, feed de atividade sem uso.
  Regras comuns às três:
    1. Uma coisa manda na tela: o que precisa de você (âmbar) ou, se nada, onde a tarefa está.
    2. Sem feed permanente. Log só dentro do item que gerou (sob demanda).
    3. Um número de progresso só, um de custo só (gasto x estimativa).
    4. Etapas concluídas viram uma linha.
  A · Linha do tempo: coluna única, a tarefa como uma conversa/PR; cada agente é um nó; o atual fica aberto.
  B · Foco único: uma coisa por vez no meio da tela (a decisão ou o que roda); fita fina de progresso no topo; resto a um clique.
  C · Quadro: colunas por quem age (precisa de você · rodando · na fila · pronto); etapas e épicos viram cartões; histórico é o mesmo quadro.
  (v6.1: "Etapas + palco" e "Painel de missão" da primeira rodada saíram; a A ficou.)
  Barra embaixo: troca direção e tela.
-->
<style>

.input::placeholder { color: var(--dim); }

/* opções (entrevista) */
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line); cursor: pointer; }
.opt:hover { background: var(--surface); }

.A-hrow { display: grid; grid-template-columns: 14px 60px 1fr auto auto auto; gap: 14px; align-items: center; padding: 11px 14px; border-radius: 12px; }
.A-hrow:hover { background: var(--surface); cursor: pointer; }
.A-hrow .num { font: 12px var(--mono); color: var(--muted); text-align: right; }

/* ============ B · Foco único ============ */
.F { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
.F-head { display: flex; align-items: center; gap: 14px; padding: 18px 0 14px; }
.F-head .t { flex: 1; text-align: center; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.F-input::placeholder { color: var(--dim); }
.kbd { font: 11px var(--mono); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 6px; padding: 0 5px; color: var(--muted); }

/* ============ C · Quadro ============ */
.Q { max-width: 1480px; margin: 0 auto; padding: 0 24px; }
.Q-task { display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-radius: 16px; margin: 4px 0 16px; flex-wrap: wrap; }
.Q-task h1 { font-size: 17px; }
.Q-task .m { font: 12px var(--mono); color: var(--muted); }
.board { display: grid; grid-template-columns: 1.55fr 1fr 1fr 1fr; gap: 14px; align-items: start; }

.col > .h { display: flex; align-items: center; gap: 8px; font: 600 12px var(--mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 2px 4px 4px; }
.col.you > .h { color: var(--warn); }
.col.new > .h { color: var(--green); }
.col > .h .n { margin-left: auto; color: var(--dim); }
.qc { padding: 12px 14px; border-radius: 14px; background: rgb(14 17 19 / 72%); border: 1px solid var(--line); display: grid; gap: 8px; cursor: pointer; }

.qc small { color: var(--dim); font-size: 12.5px; }
.qc.big { padding: 16px 18px; gap: 12px; border-color: rgb(244 181 68 / 40%); cursor: default; }
.qc.big h3 { font-size: 16px; }
.qc.ghost { background: none; border-style: dashed; }
.qc.ghost b { color: var(--muted); }
.qc.okc b { color: var(--muted); }
.qc.live { border-color: rgb(43 238 134 / 35%); }
.col .empty { color: var(--dim); font-size: 13px; text-align: center; padding: 26px 8px; }

/* ============ barra de troca ============ */
.switch { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 50; display: flex; gap: 10px; align-items: center;
  padding: 8px; border-radius: 99px; background: rgb(12 14 16 / 86%); border: 1px solid var(--line-2); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  box-shadow: 0 16px 40px rgb(0 0 0 / 50%); max-width: calc(100vw - 24px); flex-wrap: wrap; justify-content: center; }
@media (max-width: 1100px) { .switch { border-radius: 22px; } body { padding-bottom: 140px; } }
.switch .grp { display: flex; gap: 2px; padding: 3px; border-radius: 99px; background: var(--well); }
.switch button { border: 0; background: none; padding: 6px 12px; border-radius: 99px; color: var(--muted); cursor: pointer; font-size: 12.5px; white-space: nowrap; }
.switch button.on { background: var(--green); color: #04130a; font-weight: 600; }
.switch .grp.scr button.on { background: rgb(255 255 255 / 14%); color: var(--fg); }
.about { max-width: 860px; margin: 14px auto 0; padding: 0 20px; font-size: 12.5px; color: var(--dim); text-align: center; }

@media (max-width: 1100px) { .board { grid-template-columns: 1fr 1fr; } }

      <div class="row" style="align-items:flex-end"><span class="F-big ok-t">28</span><span class="dim mono" style="font-size:16px;padding-bottom:4px">/ 40 testes</span><span class="sp"></span><span class="mono muted" style="font-size:13px">tentativa 1 de 3</span></div>
      <div class="bar"><b style="width:70%"></b></div>
      <p class="lead">O Developer terminou a rodada 2 (offset da última página e total com filtro). Te aviso pelo Windows se precisar de você.</p>
      <div class="F-acts"><a class="link">ver saída ao vivo</a><a class="link">ver diff do Developer</a><span class="sp"></span><button class="btn ghost sm">Cancelar tarefa</button></div>
    </div>
    <div class="F-meanwhile"><span>11 min · $0,61 de ~$0,90 · depois: Reviewer (até 2 rodadas)</span></div>
  </div>`;

F.resultado = () => `${fHead()}
  ${rib([['Entrevista', ['done']], ['Plano', ['done']], ['Execução · 6/6', ['done', 'done', 'done', 'done', 'done', 'done']], ['Resultado', ['done'], true]])}
  <div class="F-stage">
    <span class="kicker ok-t">pronto pra commitar</span>
    <div class="glass ok F-card">
      <h1>8 arquivos em <span class="mono" style="font-size:24px">crew/T-107</span></h1>
      <div class="F-nums"><div><small>tempo</small><b>42 min</b></div><div><small>custo</small><b>$2,38</b> <span class="dim mono" style="font-size:12px">/ ~$2,10</span></div><div><small>linhas</small><b><span class="add">+345</span> <span class="rem">−11</span></b></div></div>
      ${commitMsg}
      <div class="F-acts"><button class="btn primary lg">Copiar mensagem</button><button class="btn lg">Ver diff</button><button class="btn lg">Abrir pasta</button></div>
    </div>
    <div class="F-meanwhile"><span>6 commits já na branch, um por épico · nada foi pro remoto</span><a class="link">ver commits</a></div>
  </div>`;

F.historico = () => `${fHead('')}
  <div class="F-stage" style="max-width:820px;margin-top:30px;gap:4px">
    <h1 style="font-size:24px;margin-bottom:6px">Histórico</h1>
    ${HIST.map(aHist).join('')}
  </div>`;

/* =====================================================================
   C · QUADRO (por quem age)
   ===================================================================== */
const Q = {};
const qTask = (title, id, prog, meta) => `<div class="glass Q-task"><span class="mono dim">${id}</span><h1>${title}</h1><span class="chip">${T.repo}</span><span class="sp"></span>${prog}<span class="m">${meta}</span><button class="btn ghost sm">Cancelar</button></div>`;
const qProg = (txt, pct) => `<span class="m" style="color:var(--fg)">${txt}</span><div class="bar" style="width:120px"><b style="width:${pct}%"></b></div>`;
const col = (cls, title, cards, n = '') => `<section class="col ${cls}"><div class="h">${title}<span class="n">${n}</span></div>${cards}</section>`;
const qc = (top, title, body = '', cls = '') => `<div class="qc ${cls}"><div class="top">${top}</div><b>${title}</b>${body}</div>`;
const empty = (t) => `<div class="empty">${t}</div>`;
const COLS = ['precisa de você', 'rodando', 'na fila', 'pronto'];

Q.nova = () => `${aHead('task')}
  <div class="board" style="margin-top:8px">
    ${col('new', '+ nova tarefa', `<div class="qc big" style="border-color:rgb(43 238 134 / 35%)">
      <input class="input" placeholder="O que a equipe vai fazer?">
      <textarea class="input" style="min-height:70px" placeholder="Detalhes (opcional)"></textarea>
      <div class="wrap-row"><span class="chip" style="color:var(--fg)">▣ portal-vendas ▾</span><a class="link">+ novo projeto</a><a class="link">+ pasta</a><span class="sp"></span><button class="btn primary">Começar</button></div></div>`)}
    ${col('', 'rodando', empty('nenhuma tarefa rodando'), '0')}
    ${col('', 'concluídas', HIST.filter((h) => h[1] === 'done').map(qHist).join(''), '3')}
    ${col('', 'falharam / canceladas', HIST.filter((h) => h[1] !== 'done').map(qHist).join(''), '2')}
  </div>`;

function qHist([d, s, id, t, r, k, c, du]) {
  return qc(`${dot(histIcon[s])}<span>${id}</span><span class="sp"></span><span>${d}</span>`, t, `<small class="mono">${k} · ${c} · ${du}</small>`, s === 'done' ? 'okc' : '');
}

Q.entrevista = () => `${aHead('task')}
  ${qTask(T.title, T.id, qProg('entrevista', 15), '4 min')}
  <div class="board">
    ${col('you', COLS[0], Q_NOW.map((q) => `<div class="qc big"><div class="top"><span class="warn-t">${q.topic}</span></div><h3>${q.q}</h3><small>${q.why}</small>${opts(q)}</div>`).join('')
      + '<div class="row" style="justify-content:flex-end"><button class="btn">Aceitar recomendadas</button><button class="btn amber">Enviar respostas</button></div>', '2')}
    ${col('', COLS[1], empty('Entrevistador espera suas respostas'), '0')}
    ${col('', COLS[2], qc('PL', 'Plano', '<small>Planner, depois da entrevista</small>', 'ghost') + qc('▶', 'Execução', '', 'ghost') + qc('✓', 'Resultado', '', 'ghost'), '3')}
    ${col('', COLS[3], Q_DONE.map(([t, a]) => qc(`${dot('done')}<span>rodada 1 · ${t}</span>`, a, '', 'okc')).join(''), '2')}
  </div>`;

Q.plano = () => `${aHead('task')}
  ${qTask(T.title, T.id, qProg('plano', 30), `9 min · est. ${PLAN.est.usd}`)}
  <div class="board">
    ${col('you', COLS[0], `<div class="qc big"><div class="top"><span class="warn-t">plano · aprovar</span></div><h3>${PLAN.summary}</h3>
      <div class="wrap-row"><span class="chip">${PLAN.est.usd}</span><span class="chip">${PLAN.est.tokens} tokens</span><span class="chip">sessão ${PLAN.est.session}</span></div>
      <small>${PLAN.why}</small><a class="link">critérios, passos e arquivos</a>
      <div class="row" style="justify-content:flex-end"><button class="btn">Pedir ajuste</button><button class="btn amber">Aprovar e rodar</button></div></div>`, '1')}
    ${col('', COLS[1], empty('nada rodando até você aprovar'), '0')}
    ${col('', COLS[2] + ' · proposto', PLAN_EPICS.map((e) => qc(`<span>☑</span><span>${e.id}</span><span class="sp"></span><span class="chip">${e.size}</span>`, e.title, `<small class="mono">${e.deps === '—' ? 'paralelo' : 'espera ' + e.deps} · ${e.usd}</small>`, 'ghost')).join('') + qc('REV', 'Review final', '<small class="mono">depois de todos</small>', 'ghost'), '6')}
    ${col('', COLS[3], qc(`${dot('done')}<span>entrevista</span>`, '2 rodadas · 4 decisões', '', 'okc'), '1')}
  </div>`;

Q.epicos = () => `${aHead('task')}
  ${qTask(T.title, T.id, qProg('1/6 prontos', 17), `${T.time} · ${T.cost} de ~${T.est}`)}
  <div class="board">
    ${col('you', COLS[0], `<div class="qc big"><div class="top"><span class="warn-t">E2 · Tester 3/3</span><span class="sp"></span><span>${EPICS[0].cost}</span></div><h3>${EPICS[0].title}</h3>
      <small>Tester falhou 3 vezes seguidas. E3 e o review final esperam por ele.</small>
      <div class="term" style="font-size:12px">${TEST_OUT}</div>
      <textarea class="input" placeholder="Instrução pro Developer"></textarea>
      <div class="row" style="justify-content:flex-end;flex-wrap:wrap"><a class="link">log</a><span class="sp"></span><button class="btn">+2 tentativas</button><button class="btn amber">Enviar instrução</button></div></div>`, '1')}
    ${col('', COLS[1], qc(`${dot('run')}<span>E4 · Tester</span><span class="sp"></span><span>${EPICS[1].cost}</span>`, EPICS[1].title, `<small class="mono">npm test · 31/38</small><div class="bar"><b style="width:82%"></b></div>`, 'live')
      + qc(`${dot('run')}<span>E5 · Developer</span><span class="sp"></span><span>${EPICS[2].cost}</span>`, EPICS[2].title, '<small>editando useExport.ts</small>', 'live'), '2')}
    ${col('', COLS[2], qc('E3', EPICS[4].title, '<small class="mono">espera E1, E2</small>', 'ghost') + qc('REV', 'Review final', '<small class="mono">depois de todos</small>', 'ghost'), '2')}
    ${col('', COLS[3], qc(`${dot('done')}<span>E1 · a3f91c2</span><span class="sp"></span><span>${EPICS[3].cost}</span>`, EPICS[3].title, '', 'okc')
      + qc(`${dot('done')}<span>plano</span>`, '5 épicos + review · ~$2,10', '', 'okc') + qc(`${dot('done')}<span>entrevista</span>`, '2 rodadas · 4 decisões', '', 'okc'), '3')}
  </div>`;

Q.unica = () => `${aHead('task')}
  ${qTask('Corrigir paginação da busca de clientes', 'T-108', qProg('Tester', 60), '11 min · $0,61 de ~$0,90')}
  <div class="board">
    ${col('you', COLS[0], empty('Nada pra você agora.<br>Te aviso pelo Windows quando precisar.'), '0')}
    ${col('', COLS[1], `<div class="qc live" style="gap:10px"><div class="top">${dot('run')}<span>Tester · tentativa 1 de 3</span></div><b>Rodando a suíte</b>
      <div class="row" style="align-items:flex-end"><span style="font-size:30px;font-weight:600" class="ok-t">28</span><span class="dim mono">/ 40</span></div><div class="bar"><b style="width:70%"></b></div>
      <small>2 testes novos em search.pagination.test.ts</small><a class="link">saída ao vivo</a></div>`, '1')}
    ${col('', COLS[2], qc('RV', 'Reviewer', '<small class="mono">até 2 rodadas</small>', 'ghost') + qc('✓', 'Resultado', '', 'ghost'), '2')}
    ${col('', COLS[3], qc(`${dot('done')}<span>Developer · rodada 2</span>`, 'Offset da última página e total com filtro', '<small class="mono">4 arquivos · ver diff</small>', 'okc')
      + qc(`${dot('done')}<span>plano</span>`, '3 passos · 4 arquivos', '', 'okc') + qc(`${dot('done')}<span>entrevista</span>`, '1 rodada · 2 decisões', '', 'okc'), '3')}
  </div>`;

Q.resultado = () => `${aHead('task')}
  ${qTask(T.title, T.id, qProg('6/6 prontos', 100), '42 min · $2,38 de ~$2,10')}
  <div class="board">
    ${col('you', 'revisar e commitar', `<div class="qc big"><div class="top"><span class="warn-t">crew/T-107</span><span class="sp"></span><span><span class="add">+345</span> <span class="rem">−11</span></span></div><h3>8 arquivos, 6 commits na branch</h3>
      ${commitMsg}<a class="link">ver diff dos 8 arquivos</a>
      <div class="row" style="justify-content:flex-end;flex-wrap:wrap"><button class="btn">Abrir pasta</button><button class="btn">Copiar branch</button><button class="btn primary">Copiar mensagem</button></div></div>`, '1')}
    ${col('', COLS[1], empty('nada rodando'), '0')}
    ${col('', COLS[2], empty('nada na fila'), '0')}
    ${col('', COLS[3], COMMITS.map(([e, s, m]) => qc(`${dot('done')}<span>${e} · ${s}</span>`, m, '', 'okc')).join(''), '6')}
  </div>`;

Q.historico = () => `${aHead('hist')}
  <div class="board" style="margin-top:8px">
    ${col('', 'rodando', qc(`${dot('run')}<span>T-108</span><span class="sp"></span><span>agora</span>`, 'Corrigir paginação da busca de clientes', '<small class="mono">Tester · 11 min · $0,61</small>', 'live'), '1')}
    ${col('', 'concluídas', HIST.filter((h) => h[1] === 'done').map(qHist).join(''), '3')}
    ${col('', 'falharam', HIST.filter((h) => h[1] === 'err').map(qHist).join(''), '1')}
    ${col('', 'canceladas', HIST.filter((h) => h[1] === 'todo').map(qHist).join(''), '1')}
  </div>`;

/* ---------- troca ---------- */
const DIRS = { A: ['A · Linha do tempo', A, 'Coluna única. A tarefa vira uma linha do tempo: o que passou é uma linha, o que é agora fica aberto, o que vem é cinza. Sem feed: o log fica dentro de cada nó.', 'A'],
  B: ['B · Foco único', F, 'Uma coisa por vez no meio da tela: a decisão, ou o que está rodando se nada precisa de você. Uma fita fina no topo mostra onde a tarefa está; o resto fica a um clique.', 'F'],
  C: ['C · Quadro', Q, 'Colunas por quem age: precisa de você, rodando, na fila, pronto. Etapas e épicos viram cartões que andam da fila até o pronto. O histórico é o mesmo quadro, com tarefas.', 'Q'] };
const SCREENS = [['nova', 'Nova tarefa'], ['entrevista', 'Entrevista'], ['plano', 'Plano'], ['epicos', 'Épicos + escalada'], ['unica', 'Execução única'], ['resultado', 'Resultado'], ['historico', 'Histórico']];
const params = new URLSearchParams(location.hash.slice(1));
let dir = params.get('d') || 'A';
let scr = params.get('s') || 'epicos';

function render() {
  const [, impl, about] = DIRS[dir];
  const app = document.getElementById('app');
  app.className = DIRS[dir][3];
  app.innerHTML = impl[scr]();
  document.getElementById('about').textContent = about;
  document.getElementById('dirs').innerHTML = Object.entries(DIRS).map(([k, [l]]) => `<button data-d="${k}" class="${k === dir ? 'on' : ''}">${l}</button>`).join('');
  document.getElementById('scrs').innerHTML = SCREENS.map(([k, l]) => `<button data-s="${k}" class="${k === scr ? 'on' : ''}">${l}</button>`).join('');
  history.replaceState(null, '', `#d=${dir}&s=${scr}`);
}
document.querySelector('.switch').addEventListener('click', (ev) => {
  const b = ev.target.closest('button');
  if (!b) return;
  if (b.dataset.d) dir = b.dataset.d;
  if (b.dataset.s) scr = b.dataset.s;
  render();
  window.scrollTo(0, 0);
});
render();
</script>
</body>
</html>
