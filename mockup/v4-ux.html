<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dev-crew · mockup v4 (UX)</title>
<!--
  Mockup v4: remodelagem da experiência (2026-10-14), sobre a skin Liquid Glass.
  Novo em relação ao index.html (v3):
    1. Faixa "Agora": etapa atual, tempo, tokens, custo x estimativa e o CTA único quando precisa de você.
    2. Trilho horizontal do pipeline no lugar dos 7 cards empilhados; clicar numa etapa abre os detalhes no painel de foco.
    3. Feed de atividade unificado (todos os agentes e épicos), filtrável, no painel da direita.
    4. Resultado como tela de revisão: faixa de números, próximo passo, commits por épico, arquivos por pasta.
  Também: mini-pipeline e vista em grafo nos épicos, total ao vivo na seleção, barra de ações fixa na aprovação,
  notificação do sistema quando a tarefa espera você.
  Cenários na barra de demo embaixo (ou teclas 1, 2, 3).
-->
<style>
:root {
  color-scheme: dark;
  --bg: #070809;
  --line: rgb(255 255 255 / 8%);
  --line-2: rgb(255 255 255 / 16%);
  --fg: #eef3f0;
  --muted: rgb(238 243 240 / 70%);
  --dim: rgb(238 243 240 / 50%);
  --green: #2bee86;
  --green-2: #17b862;
  --green-hi: #8dffc0;
  --green-soft: #2bee8614;
  --warn: #f4b544;
  --warn-soft: #f4b5441c;
  --err: #ff8a82;
  --glass-bg: linear-gradient(135deg, rgb(255 255 255 / 16%), rgb(255 255 255 / 3%) 60%), rgb(10 12 14 / 32%);
  --glass-active-bg: linear-gradient(135deg, rgb(43 238 134 / 22%), rgb(255 255 255 / 4%) 70%), rgb(10 12 14 / 32%);
  --glass-wait-bg: linear-gradient(135deg, rgb(244 181 68 / 24%), rgb(255 255 255 / 4%) 70%), rgb(10 12 14 / 32%);
  --glass-blur: blur(26px) saturate(180%);
  --glass-border: rgb(255 255 255 / 8%);
  --glass-shadow: inset 0 1px 0 rgb(255 255 255 / 40%), inset 0 -1px 0 rgb(255 255 255 / 6%),
    inset 1px 0 0 rgb(255 255 255 / 14%), inset 0 0 22px rgb(255 255 255 / 4%), 0 24px 60px rgb(0 0 0 / 38%);
  --well: rgb(0 0 0 / 28%);
  --mono: ui-monospace, 'Cascadia Code', 'JetBrains Mono', Consolas, monospace;
  --sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14.5px/1.5 var(--sans); padding-bottom: 40px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

/* fundo: manchas desfocadas (igual ao Backdrop) */
.backdrop { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.backdrop span { position: absolute; border-radius: 50%; filter: blur(90px); }
.backdrop .a { left: -140px; top: -120px; width: 640px; height: 640px; background: #5a6270; opacity: .5; }
.backdrop .b { right: -160px; top: 140px; width: 660px; height: 660px; background: #8aa0b8; opacity: .26; }
.backdrop .c { left: 28%; bottom: -260px; width: 720px; height: 720px; background: #2f3640; opacity: .95; }

.glass { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 22px; box-shadow: var(--glass-shadow);
  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.dim { color: var(--dim); }

/* header */
header { display: flex; align-items: center; gap: 18px; padding: 18px 0 14px; flex-wrap: wrap; }
.brand { font: 700 17px var(--mono); margin: 0; }
.brand b { color: var(--green); }
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 99px; background: var(--well); }
.tab { border: 0; background: none; padding: 6px 14px; border-radius: 99px; cursor: pointer; color: var(--muted); font-size: 13.5px; }
.tab[aria-selected="true"] { background: rgb(255 255 255 / 10%); color: var(--fg); }
.sp { flex: 1; }
.chip { font: 12px var(--mono); color: var(--muted); padding: 5px 11px; border-radius: 99px; border: 1px solid var(--line-2); }
.kbd { font: 11px var(--mono); color: var(--dim); border: 1px solid var(--line-2); border-radius: 6px; padding: 1px 6px; }

/* botões */
.btn { border: 1px solid var(--line-2); background: rgb(255 255 255 / 6%); padding: 8px 16px; border-radius: 99px; cursor: pointer; font-size: 13.5px; white-space: nowrap; }
.btn:hover { background: rgb(255 255 255 / 12%); }
.btn.primary { background: var(--green); border-color: var(--green); color: #04130a; font-weight: 700; }
.btn.primary:hover { background: var(--green-hi); }
.btn.primary[disabled] { opacity: .4; cursor: default; }
.btn.warn { background: var(--warn); border-color: var(--warn); color: #1d1300; font-weight: 700; }
.btn.link { border: 0; background: none; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 8px 6px; }
.btn.sm { padding: 5px 12px; font-size: 12.5px; }

/* 1. faixa Agora */
.now { position: sticky; top: 10px; z-index: 5; display: flex; align-items: center; gap: 18px; padding: 12px 14px 12px 18px; margin-bottom: 14px; flex-wrap: wrap; }
.now.run { background: var(--glass-active-bg); box-shadow: var(--glass-shadow), 0 0 0 1px rgb(43 238 134 / 40%); }
.now.wait { background: var(--glass-wait-bg); box-shadow: var(--glass-shadow), 0 0 0 1px rgb(244 181 68 / 55%), 0 0 50px rgb(244 181 68 / 18%); }
.now .pulse { width: 12px; height: 12px; border-radius: 50%; flex: none; background: var(--green); animation: ring 1.6s ease-out infinite; }
.now.wait .pulse { background: var(--warn); animation-name: ringw; }
.now.done .pulse { animation: none; box-shadow: 0 0 0 4px rgb(43 238 134 / 20%); }
.now .what { min-width: 0; flex: 1 1 320px; }
.now .what b { display: block; font-size: 15.5px; }
.now .what span { display: block; font: 13px var(--mono); color: var(--green-hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now.wait .what span { color: var(--warn); }
.now.done .what span { color: var(--muted); }
.metrics { display: flex; gap: 18px; flex-wrap: wrap; }
.metric { font-size: 12px; color: var(--muted); line-height: 1.25; }
.metric b { display: block; font: 600 14px var(--mono); color: var(--fg); }
.budget { width: 110px; height: 5px; border-radius: 99px; background: rgb(255 255 255 / 14%); margin-top: 4px; overflow: hidden; }
.budget i { display: block; height: 100%; background: linear-gradient(90deg, var(--green), var(--green-hi)); border-radius: 99px; }
.now .actions { display: flex; gap: 6px; align-items: center; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgb(43 238 134 / 60%); } 100% { box-shadow: 0 0 0 12px rgb(43 238 134 / 0%); } }
@keyframes ringw { 0% { box-shadow: 0 0 0 0 rgb(244 181 68 / 60%); } 100% { box-shadow: 0 0 0 12px rgb(244 181 68 / 0%); } }

/* 2. trilho do pipeline */
.rail { display: flex; align-items: flex-start; padding: 16px 18px 12px; margin-bottom: 14px; overflow-x: auto; }
.step { flex: none; width: 118px; border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 4px 2px 8px; border-radius: 16px; text-align: center; }
.step:hover { background: rgb(255 255 255 / 5%); }
.step[aria-current="true"] { background: rgb(255 255 255 / 9%); box-shadow: inset 0 0 0 1px var(--line-2); }
.step .dot { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid rgb(255 255 255 / 30%); display: grid; place-items: center; font: 700 13px var(--mono); color: var(--muted); position: relative; }
.step .lbl { font-weight: 650; font-size: 13px; }
.step .sub { font: 11px var(--mono); color: var(--dim); line-height: 1.3; }
.step.idle { opacity: .55; }
.step.done .dot { background: rgb(43 238 134 / 18%); border-color: var(--green); color: var(--green); }
.step.active .dot { border-color: var(--green); color: var(--green); animation: ring 1.6s ease-out infinite; }
.step.active .sub { color: var(--green-hi); }
.step.waiting .dot { border-color: var(--warn); color: var(--warn); animation: ringw 1.6s ease-out infinite; }
.step.waiting .sub { color: var(--warn); }
.step .loop { position: absolute; top: -7px; right: -14px; font: 700 10px var(--mono); color: var(--warn); background: #1d1608; border: 1px solid rgb(244 181 68 / 50%); border-radius: 99px; padding: 0 5px; }
.seg { flex: 1 0 18px; height: 2px; margin-top: 21px; background: rgb(255 255 255 / 14%); border-radius: 2px; }
.seg.on { background: var(--green-2); }
.seg.active { background: linear-gradient(90deg, var(--green-2), var(--green-hi), var(--green-2)); background-size: 200% 100%; animation: flow 1.4s linear infinite; }
@keyframes flow { to { background-position: -200% 0; } }
.lanes { display: flex; gap: 3px; width: 74px; }
.lanes i { flex: 1; height: 5px; border-radius: 2px; background: rgb(255 255 255 / 16%); }
.lanes i.merged { background: var(--green); }
.lanes i.running { background: var(--green-hi); animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }

/* layout de 2 painéis */
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 370px; gap: 16px; align-items: start; }
.focus { padding: 22px 24px 24px; min-height: 420px; position: relative; }
.focus h2 { margin: 0; font-size: 19px; letter-spacing: -.2px; }
.focus .hd { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.focus .hd .muted { font-size: 13px; }
.seg-ctl { display: flex; gap: 3px; padding: 3px; border-radius: 99px; background: var(--well); }
.seg-ctl button { border: 0; background: none; padding: 4px 12px; border-radius: 99px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.seg-ctl button[aria-pressed="true"] { background: rgb(255 255 255 / 11%); color: var(--fg); }
.well { background: var(--well); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
h3 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); margin: 22px 0 8px; }

/* épicos: board */
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.col h4 { margin: 0 0 8px; font-size: 12.5px; color: var(--muted); font-weight: 600; display: flex; gap: 8px; }
.col h4 span { color: var(--dim); font-family: var(--mono); }
.ecard { width: 100%; text-align: left; cursor: pointer; display: block; border: 1px solid var(--glass-border); border-radius: 16px; padding: 12px 13px; margin-bottom: 8px; background: rgb(255 255 255 / 5%); }
.ecard:hover { border-color: var(--line-2); }
.ecard.sel { border-color: rgb(43 238 134 / 60%); box-shadow: 0 0 0 1px rgb(43 238 134 / 35%); }
.ecard .t { display: flex; gap: 8px; align-items: center; font-weight: 650; font-size: 13.5px; }
.eid { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 700 11px var(--mono); border: 1.5px solid rgb(255 255 255 / 30%); color: var(--muted); }
.ecard.running .eid { border-color: var(--green); color: var(--green); }
.ecard.merged .eid { background: rgb(43 238 134 / 18%); border-color: var(--green); color: var(--green); }
.ecard .nowtxt { font: 12px var(--mono); color: var(--green-hi); margin: 6px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ecard .meta { font: 11px var(--mono); color: var(--dim); margin-top: 6px; }
.mp { display: flex; align-items: center; gap: 4px; margin-top: 8px; font: 10.5px var(--mono); color: var(--dim); }
.mp i { font-style: normal; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line-2); }
.mp i.done { color: var(--green); border-color: rgb(43 238 134 / 45%); }
.mp i.active { color: #04130a; background: var(--green); border-color: var(--green); }
.mp i.fail { color: var(--err); border-color: rgb(255 138 130 / 50%); }
.mp b { width: 10px; height: 1px; background: var(--line-2); }
.mp .rt { color: var(--warn); margin-left: 4px; }

/* épicos: grafo */
.graph { display: flex; gap: 10px; align-items: center; overflow-x: auto; padding-bottom: 6px; }
.gcol { display: flex; flex-direction: column; gap: 8px; min-width: 190px; }
.garrow { color: var(--dim); font: 18px var(--mono); }
.gcol .ecard { margin: 0; }

/* plano / aprovação */
.plan p { margin: 0 0 10px; }
.epick { display: grid; grid-template-columns: 22px 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); margin-bottom: 6px; cursor: pointer; }
.epick:hover { border-color: var(--line-2); }
.epick input { accent-color: var(--green); width: 16px; height: 16px; }
.epick .nm { font-weight: 600; font-size: 13.5px; }
.epick .dp { display: block; font: 11px var(--mono); color: var(--dim); font-weight: 400; }
.epick .est { font: 12px var(--mono); color: var(--muted); text-align: right; }
.size { font: 700 10.5px var(--mono); padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line-2); color: var(--muted); }
.actionbar { position: sticky; bottom: 12px; margin-top: 18px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 14px; border-radius: 18px;
  background: rgb(14 16 18 / 82%); border: 1px solid rgb(244 181 68 / 45%); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
.actionbar .tot { flex: 1 1 200px; font-size: 13px; color: var(--muted); }
.actionbar .tot b { color: var(--fg); font-family: var(--mono); }
textarea { width: 100%; min-height: 70px; resize: vertical; background: var(--well); color: var(--fg); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; font: 13.5px var(--sans); margin-top: 10px; }

/* entrevista */
.qa { margin: 0 0 12px; }
.qa .q { font-weight: 600; }
.qa .a { color: var(--green-hi); font-family: var(--mono); font-size: 13px; margin-top: 3px; }

/* 4. resultado */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
.stat { background: var(--well); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.stat b { display: block; font: 700 18px var(--mono); }
.stat span { font-size: 12px; color: var(--muted); }
.stat .add { color: var(--green); } .stat .del { color: var(--err); }
.next { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 14px; align-items: start; margin-top: 16px; padding: 16px; border-radius: 18px;
  background: var(--glass-active-bg); box-shadow: 0 0 0 1px rgb(43 238 134 / 35%); }
.next pre { grid-column: 1 / -1; margin: 0; font: 12.5px/1.55 var(--mono); white-space: pre-wrap; background: var(--well); border-radius: 12px; padding: 12px 14px; border: 1px solid var(--line); }
.next .where { font: 12px var(--mono); color: var(--muted); }
.commits { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid rgb(43 238 134 / 35%); }
.commits li { position: relative; padding: 4px 0 10px 12px; font-size: 13.5px; }
.commits li::before { content: ''; position: absolute; left: -20px; top: 10px; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); border: 2px solid var(--green); }
.commits .sha { font: 12px var(--mono); color: var(--green-hi); margin-right: 6px; }
.commits .ep { font: 11px var(--mono); color: var(--dim); margin-right: 6px; }
.dir { font: 12px var(--mono); color: var(--dim); margin: 12px 0 4px; }
.file { width: 100%; display: grid; grid-template-columns: 18px minmax(0, 1fr) auto 90px; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 10px; border: 0; background: none; cursor: pointer; text-align: left; font: 13px var(--mono); }
.file:hover { background: rgb(255 255 255 / 5%); }
.file .st { font-weight: 700; }
.file .st.A { color: var(--green); } .file .st.M { color: var(--warn); }
.file .n { font-size: 11.5px; color: var(--dim); }
.diffbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: rgb(255 255 255 / 8%); }
.diffbar i { display: block; height: 100%; }
.diffbar .p { background: var(--green); } .diffbar .m { background: var(--err); }
.diff { margin: 2px 0 8px 28px; font: 12px/1.6 var(--mono); background: var(--well); border-radius: 10px; border: 1px solid var(--line); padding: 8px 0; overflow-x: auto; }
.diff div { padding: 0 12px; white-space: pre; }
.diff .p { background: rgb(43 238 134 / 10%); color: var(--green-hi); }
.diff .m { background: rgb(255 107 107 / 10%); color: var(--err); }
.diff .note { color: var(--warn); font-family: var(--sans); white-space: normal; padding: 6px 12px 0; }

/* 3. feed de atividade */
.feed { position: sticky; top: 92px; max-height: calc(100vh - 110px); display: flex; flex-direction: column; overflow: hidden; }
.feed .fh { padding: 16px 18px 10px; border-bottom: 1px solid var(--line); }
.feed .fh h2 { margin: 0 0 10px; font-size: 15px; display: flex; gap: 8px; align-items: center; }
.feed .fh h2 .live { font: 11px var(--mono); color: var(--green); }
.filters { display: flex; gap: 5px; flex-wrap: wrap; }
.filters button { border: 1px solid var(--line-2); background: none; border-radius: 99px; padding: 2px 10px; font: 11.5px var(--mono); color: var(--muted); cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--green-soft); color: var(--green); border-color: rgb(43 238 134 / 50%); }
.events { list-style: none; margin: 0; padding: 8px 10px 14px; overflow-y: auto; }
.ev { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 2px 10px; padding: 7px 8px; border-radius: 12px; }
.ev time { font: 11px var(--mono); color: var(--dim); padding-top: 2px; }
.ev .who { font-size: 12px; font-weight: 650; }
.ev .who .tagep { font: 10.5px var(--mono); color: var(--dim); font-weight: 400; margin-left: 6px; }
.ev p { grid-column: 2; margin: 1px 0 0; font-size: 13px; color: var(--muted); }
.ev.ok .who { color: var(--green); }
.ev.fail .who { color: var(--err); }
.ev.you { background: var(--warn-soft); }
.ev.you .who { color: var(--warn); }
.ev.new { animation: fadein .6s ease-out; }
@keyframes fadein { from { background: rgb(43 238 134 / 18%); } }

/* notificação do sistema (simulada) */
.toast { position: fixed; right: 22px; bottom: 22px; width: 340px; z-index: 20; padding: 14px 16px; border-radius: 14px; background: #202326; border: 1px solid rgb(255 255 255 / 12%); box-shadow: 0 20px 50px rgb(0 0 0 / 55%); font-size: 13px; }
.toast .app { font-size: 11.5px; color: var(--dim); display: flex; justify-content: space-between; }
.toast b { display: block; margin: 4px 0 2px; font-size: 14px; }
.toast .x { border: 0; background: none; cursor: pointer; color: var(--dim); }

/* barra de demo do mockup */
.demo { display: flex; width: fit-content; max-width: 100%; overflow-x: auto; margin: 12px auto 0; gap: 4px; align-items: center; padding: 6px 6px 6px 14px; border-radius: 99px;
  background: rgb(20 22 24 / 90%); border: 1px dashed rgb(255 255 255 / 25%); font-size: 12px; color: var(--dim); white-space: nowrap; }
.demo button { border: 0; background: none; padding: 6px 12px; border-radius: 99px; cursor: pointer; color: var(--muted); font-size: 12.5px; }
.demo button[aria-pressed="true"] { background: var(--green); color: #04130a; font-weight: 700; }

@media (max-width: 960px) {
  .grid { grid-template-columns: 1fr; }
  .feed { position: static; max-height: 460px; }
  .board { grid-template-columns: 1fr; }
  .step { width: 96px; }
}
@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  .now { top: 6px; gap: 10px; }
  .metrics { gap: 12px; }
  .step { width: 84px; }
  .step .lbl { font-size: 12px; }
  .focus { padding: 18px 16px; }
  .file { grid-template-columns: 18px minmax(0, 1fr) auto; }
  .file .diffbar { display: none; }
  .toast { left: 16px; right: 16px; width: auto; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
}
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"><span class="a"></span><span class="b"></span><span class="c"></span></div>

<div class="wrap">
  <div class="demo" role="group" aria-label="Cenário do mockup">
    mockup v4 ·
    <button data-sc="run" onclick="setScenario('run')">1 Executando</button>
    <button data-sc="wait" onclick="setScenario('wait')">2 Precisa de você</button>
    <button data-sc="done" onclick="setScenario('done')">3 Concluída</button>
  </div>
  <header>
    <h1 class="brand"><b>&gt;</b> dev-crew</h1>
    <div class="tabs" role="tablist" aria-label="Seções">
      <button class="tab" role="tab" aria-selected="true">Tarefa</button>
      <button class="tab" role="tab" aria-selected="false">Histórico</button>
    </div>
    <span class="muted" style="font-size:13.5px"><b class="mono" style="color:var(--fg)">T-11</b> · Exportar histórico em CSV · <span class="dim">dev-crew-full</span></span>
    <span class="sp"></span>
    <span class="chip">sessão 31% · semana 12%</span>
    <span class="kbd" title="Paleta de comandos">Ctrl K</span>
  </header>

  <section id="now" class="now glass" aria-live="polite"></section>
  <nav id="rail" class="rail glass" aria-label="Etapas da tarefa"></nav>

  <div class="grid">
    <main id="focus" class="focus glass" tabindex="-1"></main>
    <aside class="feed glass" aria-label="Atividade">
      <div class="fh">
        <h2>Atividade <span class="live" id="live"></span></h2>
        <div class="filters" id="filters" role="group" aria-label="Filtrar atividade"></div>
      </div>
      <ol class="events" id="events"></ol>
    </aside>
  </div>
</div>

<div id="toast"></div>


<script>
const EPICS = [
  { id: 'E1', title: 'Endpoint GET /api/tasks.csv', size: 'S', deps: [], usd: 1.2, tok: '48k' },

/* 2. trilho */
function renderRail() {
  const rail = SC[S.sc].rail;
  const parts = [];
  STEPS.forEach(([k, label, icon], i) => {
    const [st, sub] = rail[k];
    if (i > 0) {
      const prev = rail[STEPS[i - 1][0]][0];
      const segSt = st === 'active' || st === 'waiting' ? 'active' : prev === 'done' && st === 'done' ? 'on' : '';
      parts.push(`<span class="seg ${segSt}" aria-hidden="true"></span>`);
    }
    const dot = st === 'done' ? '✓' : icon;
    const loop = k === 'epics' && S.sc === 'run' ? '<span class="loop" title="1 volta Tester → Developer">↺1</span>' : '';
    const lanes = k === 'epics' && S.sc !== 'wait'
      ? `<span class="lanes" aria-hidden="true">${EPICS.map(e => `<i class="${S.sc === 'done' ? 'merged' : RUN_LANES[e.id].status}"></i>`).join('')}</span>` : '';
    parts.push(`<button class="step ${st}" aria-current="${S.sel === k}" onclick="select('${k}')">
      <span class="dot">${dot}${loop}</span><span class="lbl">${label}</span>${lanes}<span class="sub">${sub}</span></button>`);
  });
  $('rail').innerHTML = parts.join('');
}

function focusEpics() {
  if (S.sc === 'wait') return `<div class="hd"><h2>Épicos</h2></div><p class="muted">Começam depois que você aprovar o plano.</p>`;
  const lanes = S.sc === 'done'
    ? Object.fromEntries(EPICS.map(e => [e.id, { status: 'merged', dev: 'done', test: 'done', tok: RUN_LANES[e.id].tok || '38k' }]))
    : RUN_LANES;
  const merged = EPICS.filter(e => lanes[e.id].status === 'merged').length;
  const running = EPICS.filter(e => lanes[e.id].status === 'running').length;
  let body;
  if (S.mode === 'board') {
    const cols = [['Na fila', 'pending'], ['Rodando', 'running'], ['Prontos', 'merged']];
    body = `<div class="board">${cols.map(([label, st]) => {
      const list = EPICS.filter(e => lanes[e.id].status === st);
      return `<div class="col"><h4>${label} <span>${list.length}</span></h4>${list.map(e => laneCard(e, lanes[e.id])).join('') || '<p class="dim" style="font-size:12.5px">nada aqui</p>'}</div>`;
    }).join('')}</div>`;
  } else {
    const depth = id => EP[id].deps.length ? 1 + Math.max(...EP[id].deps.map(depth)) : 0;
    const levels = [];
    EPICS.forEach(e => (levels[depth(e.id)] ??= []).push(e));
    body = `<div class="graph">${levels.map(l => `<div class="gcol">${l.map(e => laneCard(e, lanes[e.id])).join('')}</div>`).join('<span class="garrow">→</span>')}

  }
  return `<div class="hd"><h2>Épicos</h2><span class="muted">${merged}/4 prontos${running ? ` · ${running} em paralelo` : ''}</span><span class="sp"></span>
    <div class="seg-ctl" role="group" aria-label="Vista">

      <button aria-pressed="${S.mode === 'graph'}" onclick="S.mode='graph';render()">Grafo</button>
    </div></div>
    ${body}
    <p class="dim" style="font-size:12.5px;margin:14px 0 0">Clique num épico pra filtrar a atividade por ele.</p>`;
}

function togglePick(id) {
  if (S.picked.has(id)) {
    const drop = x => { S.picked.delete(x); EPICS.filter(e => e.deps.includes(x)).forEach(e => drop(e.id)); };
    drop(id);
  } else {
    const add = x => { S.picked.add(x); EP[x].deps.forEach(add); };
    add(id);
  }
  render();
}
function toggleAdjust() { S.adjust = !S.adjust; render(); }
function toggleFile(key) { S.openFile = S.openFile === key ? null : key; render(); }
function setFilter(k) { S.filter = S.filter === k && k !== 'all' ? 'all' : k; render(); }
function copy(btn, text) {
  navigator.clipboard?.writeText(text).catch(() => {});
  const old = btn.textContent; btn.textContent = 'Copiado ✓';
  setTimeout(() => { btn.textContent = old; }, 1400);
}

function render() {
  document.querySelectorAll('.demo button').forEach(b => b.setAttribute('aria-pressed', b.dataset.sc === S.sc));
  renderNow(); renderRail(); renderFocus(); renderFeed(); renderToast();
}

document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  const sc = { 1: 'run', 2: 'wait', 3: 'done' }[e.key];
  if (sc) setScenario(sc);
});
setScenario(SC[location.hash.slice(1)] ? location.hash.slice(1) : 'run');
</script>
</body>
</html>
