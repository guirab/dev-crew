<title>dev-crew · mockup v6 (linha do tempo)</title>
<!--
  Mockup v6 (2026-10-16): direção A "Linha do tempo", escolhida entre as três de mockup/v6-opcoes.html.
  Mesmas cores do v4/v5 (grafite + verde #2bee86, âmbar = sua vez, vermelho = falha).
  Regras:
    1. Uma coluna. A tarefa é uma linha do tempo de agentes: o que passou vira uma linha, o atual fica aberto, o que vem fica cinza.
    2. Sem barra de resumo: o nó que precisa de você carrega a ação; o título da aba do navegador avisa o estado.
    3. Sem feed. Log, diff e saída de teste abrem dentro do nó que os gerou, sob demanda.
    4. Épicos dentro do nó Execução, agrupados por quem age: precisa de você · rodando · na fila · prontos.
       Cada épico é só id, título e estado ("trabalhando"); não mostra rodada por rodada.
    6. O que mudou fica numa tela Alterações estilo git (árvore + diff), aberta pelo botão ao lado do título.
    5. A ação mora no nó que pede (âmbar). Botão principal à direita; destrutivo (cancelar) longe dele.
  Barra embaixo: troca a tela e a largura (desktop / celular).
-->
<style>

@container (max-width: 620px) {

  box-shadow: 0 30px 80px rgb(0 0 0 / 60%), inset 0 0 0 6px #0b0d0e; background: var(--bg); }

<script>

<span class="f">FAIL</span> src/server/orders/csv.test.ts › escapa aspas e quebras de linha

<span class="f">FAIL</span> src/server/orders/csv.test.ts › fecha o stream no fim

41/43 passaram`;

/* ---------- peças ---------- */

  const open = body !== null;

}

];
const params = new URLSearchParams(location.hash.slice(1));
let scr = params.get('s') || 'epicos';
let width = params.get('w') || 'desk';

function render() {
  const html = `<div class="A ${scr === 'alteracoes' ? 'wide' : ''}">${S[scr]()}</div>`;
  document.getElementById('stage').innerHTML = width === 'phone' ? `<div class="phone">${html}</div>` : html;
  document.getElementById('about').innerHTML = SCREENS.find(([k]) => k === scr)[2];
  document.getElementById('scrs').innerHTML = SCREENS.map(([k, l]) => `<button data-s="${k}" class="${k === scr ? 'on' : ''}">${l}</button>`).join('');
  document.getElementById('widths').innerHTML = [['desk', 'Desktop'], ['phone', 'Celular']].map(([k, l]) => `<button data-w="${k}" class="${k === width ? 'on' : ''}">${l}</button>`).join('');
  history.replaceState(null, '', `#s=${scr}&w=${width}`);
}
document.querySelector('.switch').addEventListener('click', (ev) => {
  const b = ev.target.closest('button');
  if (!b) return;
  if (b.dataset.s) scr = b.dataset.s;
  if (b.dataset.w) width = b.dataset.w;
  render();
  window.scrollTo(0, 0);
});
render();
</script>
</body>
</html>
