[project]
name = "crew"
version = "0.1.0"
description = "dev-crew: local multi-agent development team over NATS JetStream"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "nats-py>=2.16",
    "typer>=0.15",
    "structlog>=24.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "mcp>=2.0",
    "markdownify>=0.14",
    "claude-agent-sdk>=0.1",
]

[project.scripts]
crew = "crew.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crew"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "nats: requires a local nats-server binary",
    "live: calls the real Anthropic API (costs money)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012", "B008", "ASYNC109"]  # RUF012: pydantic copies defaults; B008: typer options

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC230", "ASYNC240"]  # sync pathlib/open in async tests is fine

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["crew.contracts.*", "crew.bus.*", "crew.orchestrator.*"]
strict = true

[[tool.mypy.overrides]]
module = ["nats.*", "markdownify.*"]
ignore_missing_imports = true
